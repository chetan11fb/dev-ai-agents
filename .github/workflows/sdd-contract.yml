name: Dev-AI SDD contract tests

on:
  pull_request:
    paths:
      - "agents/dev-ai-sdd.agent.md"
      - "installer/sdd-kit/**"
      - "scripts/test-sdd-contract.mjs"
      - "scripts/validate-registry.mjs"
      - "registry/marketplace.json"
      - "package.json"
      - "README.md"
      - ".github/workflows/sdd-contract.yml"
  push:
    branches: [main]
    paths:
      - "agents/dev-ai-sdd.agent.md"
      - "installer/sdd-kit/**"
      - "scripts/test-sdd-contract.mjs"
      - "scripts/validate-registry.mjs"
      - "registry/marketplace.json"
      - "package.json"
      - "README.md"
      - ".github/workflows/sdd-contract.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
