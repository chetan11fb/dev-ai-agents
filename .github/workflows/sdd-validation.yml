name: SDD workflow validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "agents/qa/**"
      - "skills/qa-engineering/**"
      - "docs/qa-engineering-suite.md"
      - "scripts/qa-suite.test.mjs"
      - "agents/dev-ai-sdd.agent.md"
      - "agents/dev-ai-swarm-orchestrator.agent.md"
      - "skills/development/parallel-worktree-orchestration/**"
      - "prompts/parallel-worktree-engineering.md"
      - "scripts/parallel-worktree.test.mjs"
      - "installer/sdd-kit/**"
      - "scripts/sdd-state.test.mjs"
      - "scripts/sdd-prompt.test.mjs"
      - "scripts/validate-registry.mjs"
      - "package.json"
      - "registry/marketplace.json"
      - "cli/index.js"
      - "docs/sdd-runtime-qa-matrix.md"
      - ".github/workflows/sdd-validation.yml"
  push:
    branches: [main]
    paths:
      - "agents/dev-ai-sdd.agent.md"
      - "agents/dev-ai-swarm-orchestrator.agent.md"
      - "skills/development/parallel-worktree-orchestration/**"
      - "prompts/parallel-worktree-engineering.md"
      - "scripts/parallel-worktree.test.mjs"
      - "installer/sdd-kit/**"
      - "scripts/sdd-state.test.mjs"
      - "scripts/sdd-prompt.test.mjs"
      - "scripts/validate-registry.mjs"
      - "package.json"
      - "registry/marketplace.json"
      - "cli/index.js"
      - "docs/sdd-runtime-qa-matrix.md"
      - ".github/workflows/sdd-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate component registry
        run: npm run validate:registry
      - name: Test SDD state and approval gates
        run: npm run test:sdd-state
      - name: Test SDD prompt and multi-story contract
        run: npm run test:sdd-prompt
      - name: Validate CLI installer syntax
        run: npm run test:cli
      - name: Test parallel worktree workflow safety
        run: npm run test:parallel-worktree
      - name: Smoke-test QA agent and skill installation
        env:
          DEV_AI_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          target="$RUNNER_TEMP/dev-ai-qa-smoke"
          node cli/index.js --target "$target" \
            --agent dev-ai-qa \
            --agent dev-ai-test-engineer \
            --agent dev-ai-ecc-e2e-runner \
            --agent dev-ai-ecc-pr-test-analyzer \
            --agent dev-ai-accessibility \
            --skill qa-engineering
          for agent in dev-ai-qa dev-ai-test-engineer dev-ai-ecc-e2e-runner dev-ai-ecc-pr-test-analyzer dev-ai-accessibility; do
            test -s "$target/.github/agents/$agent.agent.md"
          done
          test -s "$target/.github/skills/qa-engineering/SKILL.md"
      - name: Smoke-test default SDD install and safe rerun
        env:
          DEV_AI_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          target="$RUNNER_TEMP/dev-ai-sdd-smoke"
          node cli/index.js --target "$target"
          test -f "$target/.github/agents/dev-ai-sdd.agent.md"
          test -f "$target/.dev-ai/sdd/validate-state.mjs"
          test -f "$target/specs/_template/sdd-state.json"
          agent_count=$(find "$target/.github/agents" -maxdepth 1 -type f -name 'dev-ai-sdd.agent.md' | wc -l)
          test "$agent_count" -eq 1
          before=$(find "$target" -type f | wc -l)
          if node cli/index.js --target "$target" > "$RUNNER_TEMP/reinstall.log" 2>&1; then
            echo "Expected repeat install without --force to fail"
            exit 1
          fi
          grep -q "Install aborted before writing any files" "$RUNNER_TEMP/reinstall.log"
          after=$(find "$target" -type f | wc -l)
          test "$before" -eq "$after"
          node --check "$target/.dev-ai/sdd/validate-state.mjs"
