<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">DEV-AI Agents — animated AI agent orchestration</title>
<desc id="desc">A futuristic animated scene showing an AI agent core coordinating coding, review, testing, security and deployment agents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#10134a"/><stop offset="1" stop-color="#16072f"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#fff" stop-opacity=".98"/><stop offset=".2" stop-color="#67e8f9" stop-opacity=".95"/><stop offset=".55" stop-color="#6366f1" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <linearGradient id="line"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#64748b" stroke-opacity=".12"/></pattern>
  <style>
    .txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e5e7eb}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .node{fill:#0b1027;stroke:#67e8f9;stroke-width:2}.label{font-size:17px;font-weight:700;letter-spacing:2px}
    .sub{font-size:12px;fill:#94a3b8;letter-spacing:1.5px}.flow{fill:none;stroke:url(#line);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 16;animation:dash 2.5s linear infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}.orbit{fill:none;stroke:#67e8f9;stroke-opacity:.28;stroke-width:2;stroke-dasharray:5 12;animation:spin 12s linear infinite}
    .agent{animation:float 3.2s ease-in-out infinite}.agent2{animation:float 3.2s ease-in-out 1.1s infinite}
    @keyframes dash{to{stroke-dashoffset:-52}} @keyframes pulse{50%{opacity:.45;transform:scale(1.08);transform-origin:700px 310px}}
    @keyframes spin{to{transform:rotate(360deg);transform-origin:700px 310px}} @keyframes float{50%{transform:translateY(-9px)}}
    @keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(900%)}} .scan{animation:scan 5s linear infinite}
  </style>
</defs>
<rect width="1400" height="620" rx="28" fill="url(#bg)"/>
<rect x="20" y="20" width="1360" height="580" rx="22" fill="url(#grid)"/>
<circle cx="700" cy="310" r="190" fill="#4f46e5" opacity=".12" filter="url(#soft)"/>
<g opacity=".55"><circle cx="700" cy="310" r="235" class="orbit"/><circle cx="700" cy="310" r="165" class="orbit" style="animation-duration:8s"/></g>

<text x="700" y="62" text-anchor="middle" class="txt" font-size="18" font-weight="800" letter-spacing="5">DEV-AI AGENTS</text>
<text x="700" y="94" text-anchor="middle" class="txt" font-size="34" font-weight="900">AI AGENT ORCHESTRATION LAB</text>
<text x="700" y="121" text-anchor="middle" class="sub">SPECIFY  →  REASON  →  BUILD  →  REVIEW  →  TEST  →  SHIP</text>

<g class="flow">
<path d="M250 205 C390 220 500 250 590 285"/>
<path d="M250 420 C390 390 500 350 590 330"/>
<path d="M1150 205 C1010 220 900 250 810 285"/>
<path d="M1150 420 C1010 390 900 350 810 330"/>
</g>

<g class="pulse">
<circle cx="700" cy="310" r="105" fill="url(#core)" filter="url(#glow)"/>
<circle cx="700" cy="310" r="72" fill="#070b1f" stroke="#67e8f9" stroke-width="3"/>
<text x="700" y="300" text-anchor="middle" class="txt" font-size="19" font-weight="900" letter-spacing="3">ORCHESTRATOR</text>
<text x="700" y="327" text-anchor="middle" class="mono" font-size="12" fill="#67e8f9">AGENT • PLAN • ACT</text>
</g>

<g class="agent">
<rect x="85" y="155" width="285" height="92" rx="18" class="node"/>
<text x="112" y="190" class="txt label">⚙ FULLSTACK</text><text x="112" y="216" class="sub">.NET • ANGULAR • DOMAIN</text>
<circle cx="342" cy="184" r="8" fill="#22d3ee" filter="url(#glow)"/>
</g>
<g class="agent2">
<rect x="85" y="375" width="285" height="92" rx="18" class="node"/>
<text x="112" y="410" class="txt label">♢ DEBUG / RCA</text><text x="112" y="436" class="sub">TRACE • DIAGNOSE • FIX</text>
<circle cx="342" cy="404" r="8" fill="#a78bfa" filter="url(#glow)"/>
</g>
<g class="agent2">
<rect x="1030" y="155" width="285" height="92" rx="18" class="node"/>
<text x="1057" y="190" class="txt label">✓ REVIEW</text><text x="1057" y="216" class="sub">API • SECURITY • QUALITY</text>
<circle cx="1287" cy="184" r="8" fill="#f0abfc" filter="url(#glow)"/>
</g>
<g class="agent">
<rect x="1030" y="375" width="285" height="92" rx="18" class="node"/>
<text x="1057" y="410" class="txt label">◉ QA / A11Y</text><text x="1057" y="436" class="sub">PLAYWRIGHT • WCAG • TEST</text>
<circle cx="1287" cy="404" r="8" fill="#67e8f9" filter="url(#glow)"/>
</g>

<g transform="translate(510 505)">
<rect width="380" height="58" rx="16" fill="#080d22" stroke="#6366f1"/>
<text x="190" y="25" text-anchor="middle" class="mono" font-size="12" fill="#a5b4fc">ACTIVE WORKFLOW</text>
<text x="190" y="45" text-anchor="middle" class="mono" font-size="14" fill="#e0f2fe">Story → Spec → Code → PR → Evidence</text>
<rect x="0" y="0" width="8" height="58" rx="4" fill="#22d3ee" class="scan"/>
</g>
</svg>